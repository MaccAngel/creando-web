# Entorno de desarrollo completo para "Recordatorio de Tareas".
#
#   docker compose up --build
#
# Servicios:
#   - db          MariaDB con el esquema y los datos de ejemplo precargados.
#   - app         La aplicación PHP en http://localhost:8000
#   - phpmyadmin  Gestor visual de la base de datos en http://localhost:8080
#
# Las credenciales OAuth (Google/Microsoft) se pasan por variables de entorno
# si quieres probar la conexión real; si no, la app funciona con tareas
# manuales y los datos de ejemplo.

services:

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: recordatorio_tareas
    ports:
      - "3306:3306"
    volumes:
      - db_datos:/var/lib/mysql
      # Scripts de inicialización (se ejecutan en orden alfabético).
      - ./sql/esquema.sql:/docker-entrypoint-initdb.d/01-esquema.sql:ro
      - ./sql/datos_ejemplo.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: recordatorio_tareas
      DB_USER: root
      DB_PASS: root
      BASE_URL: http://localhost:8000
      # Clave fija para que los tokens guardados sigan siendo válidos entre
      # reinicios. Genera la tuya con:
      #   php -r "echo base64_encode(random_bytes(32));"
      APP_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      # Credenciales OAuth opcionales (descomenta y rellena para probar):
      # GOOGLE_CLIENT_ID: ""
      # GOOGLE_CLIENT_SECRET: ""
      # MS_CLIENT_ID: ""
      # MS_CLIENT_SECRET: ""
    volumes:
      # Montar el código para desarrollo en caliente (no el vendor).
      - ./:/var/www/html
      - /var/www/html/vendor

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

volumes:
  db_datos:
